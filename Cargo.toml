[package]
name = "lightphotos"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# Also keeps the app out of THIRD-PARTY-LICENSES.txt: about.toml ignores
# unpublished crates.
publish = false
# egui 0.34 (the egui line that targets wgpu 29) requires rustc >= 1.92.
rust-version = "1.92"

[[bin]]
name = "lightphotos"
path = "src/main.rs"

# Manual validation harnesses for `scoring/facequality.rs`, `scoring/segmentation.rs` and
# `scoring/quality.rs` (see each module's docs). They link the lib target.
[[bin]]
name = "face_probe"
path = "src/bin/face_probe.rs"

[[bin]]
name = "seg_probe"
path = "src/bin/seg_probe.rs"

[[bin]]
name = "score_probe"
path = "src/bin/score_probe.rs"

[[bin]]
name = "decode_probe"
path = "src/decode/rawler/probe/main.rs"
# Exercises the non-mac RAW decode path. On macOS it compiles to a stub that
# exits, so its regression tests run in CI's Linux job.

[dependencies]
winit = "0.30.13"
wgpu = "29.0.3"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
# Reads each font face's vertical metrics so `app::fonts` can put every
# fallback face's baseline on the primary UI font's. Deliberately the same
# crate (and version) epaint parses fonts with, so the metrics we correct
# against are the ones it actually lays glyphs out with.
skrifa = "0.40"

# egui chrome (grid/filmstrip/overlays); reuses the project's wgpu 29 + winit 0.30.
egui = "0.34"
egui-wgpu = "0.34"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bare wasm32/64-unknown-unknown has no OS clock source — std::time::Instant
# panics on ::now() there (same root cause found and fixed once already, in
# rawler's own code, during the earlier wasm decode spike — see
# rawler-web-time.patch on the wasm-decode-probe-spike branch). web_time is
# the standard fix: API-compatible with std::time::Instant, backed by
# performance.now() on wasm, and a real passthrough (same type) to
# std::time::Instant on every other target, so using it unconditionally here
# is a no-op change on native. winit 0.30 itself already expects this type
# for ControlFlow::WaitUntil on wasm.
web-time = "1.1"

# Profiler for the three hot paths (folder load, thumbnail fill, open photo).
# Not optional on purpose: `#[hotpath::measure]` has to resolve in every build,
# and with the crate's own features off its macros hand the function body back
# untouched (`hotpath-macros`' `lib_off`), so the default build links nothing
# but an empty shim. Turned on by this crate's `hotpath` / `hotpath-alloc`
# features — see the `[features]` block and `src/shell/profile.rs`.
hotpath = "0.26"

# Live-object census: how many DecodedImages and Masks exist right now and how
# many bytes they hold, which a timing profiler cannot answer. Not optional,
# for the same reason hotpath above is not: `#[lightwatch::track]` has to
# resolve in every build, and with `enabled` off the attribute injects a
# zero-sized field and compiles no transport at all. Turned on by this crate's
# `lightwatch` feature. Fetched from git rather than vendored: cargo resolves a
# path dependency even when the feature that uses it is off, so a path into a
# sibling checkout would fail every build that did not have one, CI included.
# Tracks lightwatch's default branch; Cargo.lock pins the exact commit, so a
# build is reproducible without a tag and `cargo update -p lightwatch-probe`
# is what moves it.
lightwatch = { package = "lightwatch-probe", git = "https://github.com/andrewyao/lightwatch", default-features = false }

# Linear half-float pixels: `PixelFormat::LinearF16`, which
# `image_ops` reads on every platform and `decode/rawler/raw_preview.rs`'s `Quality` tier
# writes for the renderer's `Rgba16Float` texture.
half = "2"
# Local wall-clock fields for a file's modified time. Already in the tree via
# rawler and trash; `wasmbind` reads the browser's time zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[features]
# Profiling. Both are off by default and `hotpath`'s own macros expand to the
# untouched function body when its `hotpath` feature is off, so a default build
# carries no instrumentation at all — see `src/shell/profile.rs`.
hotpath = ["hotpath/hotpath"]
# Per-function allocation totals. Installs hotpath's counting global allocator,
# which adds a thread-local increment to every alloc/dealloc in the process, so
# the timings from an alloc run are not comparable with a timing-only run.
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

# Census. Compiles lightwatch's counters and its emit thread in; with it off,
# every tracked type is the struct it would have been without the attribute.
lightwatch = ["lightwatch/enabled"]

# `egui-winit`'s default features include "clipboard" (pulls in `arboard`),
# which has no working wasm32 backend at this version — see the wasm port
# plan's M0 notes. Split per-target rather than disabling clipboard for every
# platform: native keeps the full default feature set unchanged, wasm32 drops
# "clipboard" (and the Linux-only "wayland"/"x11", inert there anyway).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = "0.34"
png = "0.18"
# Native "choose a folder" dialog for the landing page / Cmd+O. Per-OS native
# picker: Cocoa NSOpenPanel via objc2 on macOS (same objc2 stack as the deps
# above — no new system libs), the Win32 dialog on Windows, and the XDG
# desktop portal (D-Bus, pure Rust — no GTK/system -dev package) on Linux.
# The Linux portal pulls a zbus/async-io transitive tree, but it is
# target_os = "linux"-gated inside rfd, so macOS/Windows builds never compile
# it. wasm has its own picker (`web_fs::pick_and_list_folder`).
rfd = "0.15"
# Blocking HTTP for the Immich export destination (`export/immich.rs`). Blocking fits:
# uploads run on the export pool's OS threads, and it keeps an async runtime
# out of a crate whose only executor is `pollster`. The browser can't reach an
# Immich server (no CORS), so wasm32 never needs it.
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# The Immich API key lives in the login Keychain (`persist/secret.rs`).
security-framework = "3"
objc2 = "0.6.4"
# Native menu bar (`shell/menu.rs`).
muda = { version = "0.20", default-features = false }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSURL", "NSEnumerator", "NSObject", "NSThread", "NSFileManager", "NSError", "NSLocale", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder"] }
objc2-core-graphics = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFURL", "CFString", "CFBase", "CFData", "CFDictionary", "CFArray"] }
objc2-image-io = { version = "0.3.2", features = ["CGImageSource", "CGImageDestination"] }
# RAW decode through CIRAWFilter (`decode/image_decode/raw_filter.rs`).
objc2-core-image = { version = "0.3.2", default-features = false, features = [
    "std",
    "CIContext",
    "CIFilter",
    "CIImage",
    "CIRAWFilter",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-image-io",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "VNRequest",
    "VNRequestHandler",
    "VNGenerateImageFeaturePrintRequest",
    "VNDetectFaceLandmarksRequest",
    "VNDetectFaceRectanglesRequest",
    "VNFaceLandmarks",
    "VNGeneratePersonSegmentationRequest",
    "VNGenerateForegroundInstanceMaskRequest",
    # macOS 15 and later; `scoring/judge.rs` checks for the class before using it.
    "VNCalculateImageAestheticsScoresRequest",
    "VNStatefulRequest",
    "objc2-core-video",
    "VNObservation",
    # VNObservation::confidence is gated on VNTypes (VNConfidence lives there).
    "VNTypes",
    "objc2-core-graphics",
    # VNFaceLandmarkRegion2D's normalizedPoints (CGPoint) is gated on this.
    "objc2-core-foundation",
] }
# Vision hands segmentation masks back as CVPixelBuffers; this is what reads
# their bytes (see `scoring/segmentation.rs`).
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
mozjpeg-rs = "0.9.2"
# Camera RAW decode. LGPL-2.1, so it stays out of the macOS build, which
# decodes RAW through ImageIO instead. Redirected to a patched local vendor copy for every target via
# `[patch.crates-io]` near the bottom of this file — see that entry's own
# comment for why (a wasm32-only bug, harmless everywhere else).
rawler = "0.7.2"
# Embedded-preview extraction (Task 10): RAW containers (CR2/NEF/ARW/DNG/...)
# are TIFF-based, so a generic TIFF/EXIF reader can open them directly and
# read the baseline IFD1 thumbnail tags every EXIF-aware viewer relies on.
# `kamadak-exif` explicitly supports "TIFF and some RAW image formats based on
# it" per its own docs, so jobs/thumbnail.rs's non-mac `try_extract_embedded_preview`
# uses it.
kamadak-exif = "0.6.1"

# `trash` (native OS trash/recycle-bin shell-out) has no wasm32 support and no
# browser equivalent (File System Access has no trash primitive).
# Split out of the `not(macos)` block above so it only applies to real non-mac
# desktop targets, not wasm32 too.
[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
trash = "5"

# Release builds run as GUI apps with no console of their own (see
# `windows_subsystem` in main.rs); `AttachConsole` borrows the terminal's when
# launched from one, so `--help`, `--profile` and diagnostics still print.
# Threading lowers the scoring workers' priority (`jobs/score.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Element",
    "console",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "File",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Location",
    "Worker",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "ErrorEvent",
    "Navigator",
    "DirectoryPickerOptions",
    "FileSystemPermissionMode",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "Storage",
    "Response",
    "Clipboard",
] }
js-sys = "0.3"
wasm_thread = "0.3"
# Already in the graph through rawler. Named here so each wasm decode thread
# can give rawler a rayon pool of its own; see `Worker::run` in jobs/loader.rs.
rayon = "1"
console_error_panic_hook = "0.1"
# `uuid` (pulled in transitively by both egui/accesskit and rawler) needs an
# explicit randomness source on wasm32 — same fix already proven in the
# tools/wasm-decode-probe spike: the "js" feature wires it to the
# browser's crypto API. Declared at the top level so Cargo's feature
# unification turns it on for every crate in the graph that pulls uuid in,
# not just a direct dependency of this crate.
uuid = { version = "1", features = ["js"] }

# Local patch, standard rawler 0.7.2 only (no third-party fork): `rawler`
# unconditionally calls `std::time::Instant::now()` in a few places (PPG
# demosaic's `imgop/sensor/bayer/ppg.rs`, notably — the code path
# `decode/rawler/raw_preview.rs`'s `DemosaicMode::Quality` runs) purely for a debug!
# timing log, which panics unconditionally on bare wasm32-unknown-unknown
# ("time not implemented on this platform" — no clock source there, hit live
# in a real Web Worker once `Quality` actually ran there, not guessed at).
# `patches/rawler-web-time.patch` swaps those 4 call sites to
# `web_time::Instant` — API-compatible, `performance.now()`-backed on wasm, a
# **real passthrough to `std::time::Instant` everywhere else** (same crate
# this repo already depends on at the top level for the identical class of
# bug — see its own Cargo.toml comment), so this has zero functional effect
# on macOS/Linux/Windows builds: timing/logging stays live on every target,
# this only changes which clock it reads.
#
# `patches/rawler-ljpeg-restart.patch` adds restart marker support to the
# lossless JPEG decoder, without which Samsung Galaxy Linear DNGs decode to
# garbage below their first 16 rows.
#
# `[patch.crates-io]` applies globally (Cargo has no way to scope a patch to
# one target), so `vendor/rawler-0.7.2` must exist for every platform and
# every Cargo entry point. It is NOT committed — `scripts/setup-vendor-rawler.sh`
# materializes it (fetch 0.7.2 from crates.io + apply the patches above) and
# must be run once per clone before any cargo command.
[patch.crates-io]
rawler = { path = "vendor/rawler-0.7.2" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
