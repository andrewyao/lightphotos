[package]
name = "lightphotos"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
# egui 0.34 (the egui line that targets wgpu 29) requires rustc >= 1.92.
rust-version = "1.92"

[[bin]]
name = "lightphotos"
path = "src/main.rs"

# Manual validation harness for `facequality.rs` (see its module docs). It pulls
# `facequality.rs` in by `#[path]` because the crate has no lib target, which
# would otherwise make `cargo test` compile that module's `#[cfg(test)]` block a
# second time in a crate root where its `crate::image_encode` fixtures don't
# exist — `test = false` keeps those tests owned solely by the main binary.
[[bin]]
name = "face_probe"
path = "src/bin/face_probe.rs"
test = false

# Same arrangement for the segmentation harness (see `segmentation.rs`).
[[bin]]
name = "seg_probe"
path = "src/bin/seg_probe.rs"
test = false

[[bin]]
name = "decode_probe"
path = "src/bin/decode_probe.rs"
test = false
required-features = ["raw-probe"]

# The wasm32 Web Worker pool's decode entry point (M4 of the wasm port plan).
# Loaded by trunk as `data-type="worker"` — its own doc comment explains why
# this must be a *separate binary* rather than a branch inside `main.rs`. On
# every other target this bin compiles to an empty stub (see the file's own
# `#[cfg]` gating) so `cargo build`/`cargo test` are unaffected.
[[bin]]
name = "wasm_worker"
path = "src/bin/wasm_worker.rs"
test = false

[dependencies]
winit = "0.30.13"
wgpu = "29.0.3"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }

# egui chrome (grid/filmstrip/overlays); reuses the project's wgpu 29 + winit 0.30.
egui = "0.34"
egui-wgpu = "0.34"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bare wasm32/64-unknown-unknown has no OS clock source — std::time::Instant
# panics on ::now() there (same root cause found and fixed once already, in
# rawler's own code, during the earlier wasm decode spike — see
# rawler-web-time.patch on the wasm-decode-probe-spike branch). web_time is
# the standard fix: API-compatible with std::time::Instant, backed by
# performance.now() on wasm, and a real passthrough (same type) to
# std::time::Instant on every other target, so using it unconditionally here
# is a no-op change on native. winit 0.30 itself already expects this type
# for ControlFlow::WaitUntil on wasm.
web-time = "1.1"

rawler = { version = "0.7.2", optional = true }
mozjpeg-rs = { version = "0.9.2", optional = true }
img-parts = { version = "0.4.0", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "tiff"] }

[features]
raw-probe = ["dep:rawler", "dep:mozjpeg-rs", "dep:img-parts", "dep:image"]

# `egui-winit`'s default features include "clipboard" (pulls in `arboard`),
# which has no working wasm32 backend at this version — see the wasm port
# plan's M0 notes. Split per-target rather than disabling clipboard for every
# platform: native keeps the full default feature set unchanged, wasm32 drops
# "clipboard" (and the Linux-only "wayland"/"x11", inert there anyway).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = "0.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSURL", "NSEnumerator", "NSObject", "NSThread", "NSFileManager", "NSError"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder"] }
objc2-core-graphics = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFURL", "CFString", "CFBase", "CFData", "CFDictionary", "CFArray"] }
objc2-image-io = { version = "0.3.2", features = ["CGImageSource", "CGImageDestination"] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "VNRequest",
    "VNRequestHandler",
    "VNGenerateImageFeaturePrintRequest",
    "VNDetectFaceLandmarksRequest",
    "VNDetectFaceRectanglesRequest",
    "VNFaceLandmarks",
    "VNGeneratePersonSegmentationRequest",
    "VNGenerateForegroundInstanceMaskRequest",
    "VNStatefulRequest",
    "objc2-core-video",
    "VNObservation",
    # VNObservation::confidence is gated on VNTypes (VNConfidence lives there).
    "VNTypes",
    "objc2-core-graphics",
    # VNFaceLandmarkRegion2D's normalizedPoints (CGPoint) is gated on this.
    "objc2-core-foundation",
] }
# Vision hands segmentation masks back as CVPixelBuffers; this is what reads
# their bytes (see `segmentation.rs`).
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
mozjpeg-rs = "0.9.2"
# Camera RAW decode (Task 10). Declared unconditionally (non-optional) here so
# the plain non-mac build always has it, alongside the optional top-level
# `rawler` entry above that `raw-probe` uses to also make it available for
# `decode_probe.rs`'s validation harness when building/running on mac.
rawler = "0.7.2"
# Embedded-preview extraction (Task 10): RAW containers (CR2/NEF/ARW/DNG/...)
# are TIFF-based, so a generic TIFF/EXIF reader can open them directly and
# read the baseline IFD1 thumbnail tags every EXIF-aware viewer relies on.
# `img-parts` (above) only understands JPEG/PNG/WebP containers, not TIFF, so
# it can't do this; `kamadak-exif` explicitly supports "TIFF and some RAW
# image formats based on it" per its own docs, so that's what thumbnail.rs's
# non-mac `try_extract_embedded_preview` uses instead.
kamadak-exif = "0.6.1"

# `trash` (native OS trash/recycle-bin shell-out) has no wasm32 support and no
# browser equivalent (File System Access has no trash primitive — see
# plans/web-wasm-port-feasibility.md and the wasm port plan's scope notes).
# Split out of the `not(macos)` block above so it only applies to real non-mac
# desktop targets, not wasm32 too.
[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
trash = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Element",
    "console",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "File",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Location",
    "Worker",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "Navigator",
    "DirectoryPickerOptions",
    "FileSystemPermissionMode",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
# `uuid` (pulled in transitively by both egui/accesskit and rawler) needs an
# explicit randomness source on wasm32 — same fix already proven in the
# tools/wasm-decode-probe spike (see plans/wasm-decode-verification-results.md
# on the wasm-decode-probe-spike branch): the "js" feature wires it to the
# browser's crypto API. Declared at the top level so Cargo's feature
# unification turns it on for every crate in the graph that pulls uuid in,
# not just a direct dependency of this crate.
uuid = { version = "1", features = ["js"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
