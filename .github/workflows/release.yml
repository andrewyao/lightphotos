name: release

# Cut a release by pushing a tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Each platform builds on its native runner (macOS decode uses Apple ImageIO;
# HEIC/Vision code is cfg-gated off on non-macOS so it still compiles).
# Ships: macOS Apple Silicon and Intel .dmgs + Linux x86_64/arm64 tarballs +
# Windows x86_64 zip. The Intel .dmg is cross-built on the Apple Silicon runner.
# The .app inside each .dmg carries the CLI binary at Contents/MacOS/lightphotos.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
            name: lightphotos-macos-arm64
          - os: macos-14        # cross-builds Intel; GitHub's Intel runners are being retired
            target: x86_64-apple-darwin
            name: lightphotos-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: lightphotos-linux-x86_64
          - os: ubuntu-24.04-arm   # native GitHub-hosted arm64 Linux runner
            target: aarch64-unknown-linux-gnu
            name: lightphotos-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: lightphotos-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins channel = "stable"; this respects it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # winit build headers (usually already present, cheap insurance).
      # rfd's Linux folder dialog uses the XDG desktop portal (D-Bus, pure
      # Rust) — no GTK/system -dev package needed.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      # Fetches plain rawler 0.8.0 from crates.io and applies the web-time
      # patch into vendor/. Needs network (CI has it).
      - name: Vendor rawler
        shell: bash
        run: ./scripts/setup-vendor-rawler.sh

      # Only the shipped binary, not the mac-only dev probes in src/bin.
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --bin lightphotos --target ${{ matrix.target }}

      # Puts the Developer ID certificate in a throwaway keychain and the
      # notary API key on disk for make-dmg.sh. A tag build without the
      # secrets fails; a manual run without them ships ad-hoc signed.
      - name: Import signing identity (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -z "$MACOS_CERT_P12" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "error: MACOS_CERT_P12 secret is missing; a release must be notarized" >&2
              exit 1
            fi
            echo "No signing secrets; building ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # Sign by the certificate's hash, read from the imported .p12, so no
          # hand-typed name has to match it.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "error: MACOS_CERT_P12 holds no Developer ID Application identity; it has:" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"

      # macOS: make-dmg.sh builds the binary, assembles and signs the .app,
      # wraps it in a drag-install .dmg, and notarizes that when the
      # signing secrets are present.
      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./scripts/make-dmg.sh ${{ matrix.target }} "${{ matrix.name }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" lightphotos -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt -C "$GITHUB_WORKSPACE/patches" LICENSE-LGPL

      # Windows: zip the .exe and the license files. Compress-Archive ships
      # with the runner; git-bash has no `zip`.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/lightphotos.exe", LICENSE-MIT, LICENSE-APACHE, patches/LICENSE-LGPL, THIRD-PARTY-LICENSES.txt -DestinationPath "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.dmg
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
