name: release

# Cut a release by pushing a tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Each platform builds on its native runner (macOS decode uses Apple ImageIO;
# HEIC/Vision code is cfg-gated off on non-macOS so it still compiles).
# Ships: macOS Apple Silicon and Intel .dmgs + Linux x86_64/arm64 tarballs +
# Windows x86_64 zip. The Intel .dmg is cross-built on the Apple Silicon runner.
# The .app inside each .dmg carries the CLI binary at Contents/MacOS/lightphotos.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
            name: lightphotos-macos-arm64
          - os: macos-14        # cross-builds Intel; GitHub's Intel runners are being retired
            target: x86_64-apple-darwin
            name: lightphotos-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: lightphotos-linux-x86_64
          - os: ubuntu-24.04-arm   # native GitHub-hosted arm64 Linux runner
            target: aarch64-unknown-linux-gnu
            name: lightphotos-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: lightphotos-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins channel = "stable"; this respects it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # winit build headers (usually already present, cheap insurance).
      # rfd's Linux folder dialog uses the XDG desktop portal (D-Bus, pure
      # Rust) — no GTK/system -dev package needed.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      # Fetches plain rawler 0.7.2 from crates.io and applies the web-time
      # patch into vendor/. Needs network (CI has it).
      - name: Vendor rawler
        shell: bash
        run: ./scripts/setup-vendor-rawler.sh

      # Only the shipped binary, not the mac-only dev probes in src/bin.
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --bin lightphotos --target ${{ matrix.target }}

      # macOS: make-dmg.sh builds the binary, assembles and ad-hoc signs the
      # .app, and wraps it in a drag-install .dmg.
      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/make-dmg.sh ${{ matrix.target }} "${{ matrix.name }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" lightphotos -C "$GITHUB_WORKSPACE" LICENSE THIRD-PARTY-LICENSES.txt

      # Windows: zip the .exe and the license files. Compress-Archive ships
      # with the runner; git-bash has no `zip`.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/lightphotos.exe", LICENSE, THIRD-PARTY-LICENSES.txt -DestinationPath "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.dmg
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
