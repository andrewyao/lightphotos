name: release

# Cut a release by pushing a tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Each platform builds on its native runner (macOS decode uses Apple ImageIO;
# HEIC/Vision code is cfg-gated off on non-macOS so it still compiles).
# Ships: macOS Apple Silicon .dmg + Linux x86_64/arm64 tarballs + Windows x86_64 zip.
# No Intel-mac. The .app inside the .dmg carries the CLI binary at
# Contents/MacOS/lightphotos.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
            name: lightphotos-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: lightphotos-linux-x86_64
          - os: ubuntu-24.04-arm   # native GitHub-hosted arm64 Linux runner
            target: aarch64-unknown-linux-gnu
            name: lightphotos-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: lightphotos-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins channel = "stable"; this respects it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # winit build headers (usually already present, cheap insurance).
      # rfd's Linux folder dialog uses the XDG desktop portal (D-Bus, pure
      # Rust) — no GTK/system -dev package needed.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      # Fetches plain rawler 0.7.2 from crates.io and applies the web-time
      # patch into vendor/. Needs network (CI has it).
      - name: Vendor rawler
        shell: bash
        run: ./scripts/setup-vendor-rawler.sh

      # Only the shipped binary. The src/bin probes (face_probe, seg_probe) are
      # mac-only dev harnesses: they #[path]-reinclude the decode modules, and
      # the non-mac decode path pulls in crate::develop / crate::coregraphics
      # which the probes don't re-declare, so `cargo build` (all targets) fails
      # to compile them on Linux / Windows.
      - name: Build
        run: cargo build --release --bin lightphotos --target ${{ matrix.target }}

      # macOS: ship the double-clickable .app inside a drag-install .dmg.
      # bundle.sh also does lsregister, which is a no-op / harmless on the
      # runner; we inline the assembly here so it targets the per-target binary.
      # hdiutil is built into the runner.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="LightPhotos.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp Info.plist "$APP/Contents/Info.plist"
          cp "target/${{ matrix.target }}/release/lightphotos" "$APP/Contents/MacOS/lightphotos"
          chmod +x "$APP/Contents/MacOS/lightphotos"

          # .dmg: stage the app + an /Applications symlink for drag-install.
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname LightPhotos -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov "${{ matrix.name }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" lightphotos

      # Windows: zip the bare .exe. Compress-Archive ships with the runner;
      # git-bash has no `zip`.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/lightphotos.exe" -DestinationPath "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.dmg
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
