<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" width="510" height="150">
  <!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
  <!-- Generated by scripts/make-icons.sh from lightphotos.svg; edit that instead. -->
  <style>
    text { fill: #1b1d21; font: 600 132px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -2px; }
    tspan { fill: #e07a1f; }
    @media (prefers-color-scheme: dark) { text { fill: #f4f1ea; } tspan { fill: #ffa447; } }
  </style>
<svg x="0" y="0" width="300" height="300" viewBox="0 0 1024 1024">
  <!-- LightPhotos app icon: a photo frame crossed by a beam of warm light.
       Drawn on Apple's 1024 px macOS icon grid (824 px tile, 100 px margin). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363a42"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="820" y1="190" x2="260" y2="820">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ff9a3c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="frameClip">
      <rect x="252" y="332" width="520" height="380" rx="60"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>

  <g clip-path="url(#tileClip)">
    <!-- the beam: narrow at the light source, widening as it falls across the frame -->
    <polygon points="770,190 850,262 430,960 120,690" fill="url(#beam)"/>
    <circle cx="790" cy="235" r="120" fill="url(#sun)"/>
  </g>

  <!-- where the beam lands inside the frame, the photo lights up -->
  <g clip-path="url(#frameClip)">
    <polygon points="770,190 850,262 430,960 120,690" fill="url(#beam)"/>
  </g>

  <!-- the photo frame -->
  <rect x="252" y="332" width="520" height="380" rx="60" fill="none" stroke="#f4f1ea" stroke-width="46"/>
</svg>
  <text x="310" y="196">Light<tspan>Photos</tspan></text>
</svg>
