[build]
target = "index.html"
# wgpu's WebGPU web-sys bindings, and the File System Access bindings
# (window.showDirectoryPicker et al.), are still gated behind this
# unstable-apis flag (see the wasm port plan's Architecture section).
# NOTE: this `rustflags` key does not seem to reach cargo in trunk 0.21.14 —
# confirmed by a build that still failed without it applied. Until that's
# root-caused, set RUSTFLAGS=--cfg=web_sys_unstable_apis in the environment
# when invoking `trunk build`/`trunk serve` instead of relying on this file.
rustflags = ["--cfg=web_sys_unstable_apis"]

[serve]
# Cross-origin isolation (COOP/COEP) is required for SharedArrayBuffer, which
# the wasm port plan's M4 (Web Worker decode pool) depends on. Not used by
# anything yet at M0, but set up now so M4 doesn't need a separate serve-config
# change later.
[serve.headers]
"Cross-Origin-Opener-Policy" = "same-origin"
"Cross-Origin-Embedder-Policy" = "require-corp"
